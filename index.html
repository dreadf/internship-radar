<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)">
  <title>Inra</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ir.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
  <link rel="stylesheet" href="vendor/radix-colors.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="brandrow">
      <a class="brand" href="#/overview" aria-label="Inra, home"><span class="logo" aria-hidden="true"></span>Inra</a>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch theme"></button>
    </div>
    <nav class="views" aria-label="Views" id="nav">
      <a href="#/overview" data-view="overview">Overview</a>
      <a href="#/internships" data-view="internships">Internships</a>
      <a href="#/competitions" data-view="competitions">Competitions</a>
      <a href="#/tracker" data-view="tracker">Tracker<span class="badge num" id="nav-count" hidden></span></a>
    </nav>
  </header>
  <main id="main" class="page" tabindex="-1"><div class="page-pad"><div class="list"><div class="row skel" aria-hidden="true"><div class="row-body"><i class="sk w70"></i><i class="sk w40"></i><i class="sk w90"></i></div></div></div></div></main>
  <div id="overlay" hidden></div>
  <div id="status" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="page-pad">This page needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
